name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: harmonia_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: harmonia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harmonia_test -d harmonia_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://harmonia_test:disposable_test_password@localhost:5432/harmonia_test
      HARMONIA_TEST_DATABASE_URL: postgresql+psycopg://harmonia_test:disposable_test_password@localhost:5432/harmonia_test
      HARMONIA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest --cov=harmonia --cov-report=term-missing --cov-report=xml
      - run: uv run playlist build examples/night-drive.yml --library examples/library.json --output /tmp/playlist.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf '%s\n' 'HARMONIA_API_KEY=ci-operator-key-for-disposable-tests' 'POSTGRES_PASSWORD=disposable_ci_password' > .env
          docker compose -p harmonia-ci up --build -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8000/healthz
          curl --fail -H 'X-API-Key: ci-operator-key-for-disposable-tests' http://127.0.0.1:8000/api/ready
          docker compose -p harmonia-ci exec -T api playlist --help
      - if: always()
        run: |
          docker compose -p harmonia-ci logs --no-color
          docker compose -p harmonia-ci down -v
